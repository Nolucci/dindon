# Dindon: everything runs locally. Nothing leaves the machine.
#
#   cp .env.example .env     (then choose the passwords)
#   docker compose up -d --build
#
# Every port is published on 127.0.0.1 only: nothing is reachable from the network.
name: dindon

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: dindon
      POSTGRES_DB: dindon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Choose a password in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dindon -d dindon"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dindon:${POSTGRES_PASSWORD}@db:5432/dindon
      DINDON_PASSWORD: ${DINDON_PASSWORD:?Choose a password in .env}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # Collection from Discord: only active with a token and a server ID (see README.md)
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DINDON_GUILD_IDS: ${DINDON_GUILD_IDS:-}
      DINDON_POLL_SECONDS: ${DINDON_POLL_SECONDS:-30}
      DINDON_THREADS: ${DINDON_THREADS:-active}
      DINDON_EXPORTER: /opt/exporter/DiscordChatExporter.Cli
      # "off" switches the watcher off (to run the live bot alone, see COLLECTE.md)
      DINDON_COLLECTOR: ${DINDON_COLLECTOR:-on}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${DINDON_PORT:-8000}:8000"
    volumes:
      - ${DINDON_INBOX_DIR:-./inbox}:/data/inbox
      - ${DINDON_ARCHIVE_DIR:-./archive}:/data/archive
      # The exporter, built for the architecture of the container (exporter/README.md)
      - ./exporter/bin:/opt/exporter:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Optional: the live bot (mode C of docs/COLLECTE.md). It receives the new messages of the followed servers from Discord's
  # Gateway the moment they are written, and hands them to the same ingestion as everything else. Same image as the application.
  # It needs the token of a BOT and the server IDs in .env, and the "Message Content Intent" switched on for the bot.
  #   docker compose --profile bot up -d --build
  bot:
    profiles: ["bot"]
    build: .
    command: ["dindon", "bot"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy   # the application applies the migrations; the bot never does
    environment:
      DATABASE_URL: postgresql://dindon:${POSTGRES_PASSWORD}@db:5432/dindon
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DINDON_GUILD_IDS: ${DINDON_GUILD_IDS:-}

  # Optional: local AI inside Docker. Meant for a Linux server (with an NVIDIA GPU, add the
  # "deploy" section of the Ollama documentation). On a Mac, Docker cannot use the GPU:
  # run Ollama natively instead and leave this service off.
  #   docker compose --profile ollama up -d
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:

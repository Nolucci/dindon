[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dindon"
version = "0.1.0"
description = "A living map of a Discord server, entirely local"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.2",
    # The Gateway connection of the bot (heartbeat, resume, rate limits), and nothing more: see app/dindon/bot/gateway.py
    "discord.py>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2",
    "jsonschema",  # to check every document that the bot builds against contracts/JSON-format.schema.json
]
# Only for tools/check_ui.py (a real browser): pip install -e ".[e2e]" && playwright install chromium
e2e = ["playwright"]

[project.scripts]
dindon = "dindon.__main__:main"

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
